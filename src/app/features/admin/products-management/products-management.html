<div class="container-fluid py-2 text-start">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold text-dark m-0">إدارة المنتجات</h2>
    </div>
    <button type="button" class="btn btn-warning fw-bold" (click)="resetForm()" data-bs-toggle="modal" data-bs-target="#productModal">
      إضافة منتج جديد
    </button>
  </div>

  <div class="card border-0 shadow-sm rounded-3 overflow-hidden bg-white">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-dark">
        <tr>
          <th>الصورة</th>
          <th>اسم المنتج</th>
          <th>القسم</th>
          <th>السعر</th>
          <th class="text-center">التحكم</th>
        </tr>
      </thead>
      <tbody>
        @for (prod of products(); track prod.id) {
        <tr>
          <td><img [src]="prod.image" style="width: 50px; height: 50px; object-fit: contain;"></td>
          <td class="fw-bold">{{ prod.title }}</td>
          <td><span class="badge bg-light text-dark">{{ prod.category }}</span></td>
          <td class="text-success fw-bold">{{ prod.price }} ج.م</td>
          <td class="text-center">
            <div class="btn-group">
              <button class="btn btn-sm btn-outline-primary" (click)="onEdit(prod)" data-bs-toggle="modal" data-bs-target="#productModal">
                <i class="bi bi-pencil-square"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="onDelete(prod.id)">
                <i class="bi bi-trash3-fill"></i>
              </button>
            </div>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form [formGroup]="productForm" (ngSubmit)="onSubmitProduct()">
        <div class="modal-body p-4">
          <div class="row g-3">
            <div class="col-8"><input class="form-control" formControlName="title" placeholder="اسم المنتج"></div>
            <div class="col-4"><input class="form-control" formControlName="price" type="number" placeholder="السعر"></div>
            <div class="col-6"><input class="form-control" formControlName="category" placeholder="القسم"></div>
            <div class="col-6"><input class="form-control" formControlName="image" placeholder="رابط الصورة"></div>
            <div class="col-12"><textarea class="form-control" formControlName="description" rows="3" placeholder="الوصف"></textarea></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
          <button type="submit" class="btn btn-warning" data-bs-dismiss="modal">حفظ التغييرات</button>
        </div>
      </form>
    </div>
  </div>
</div>
