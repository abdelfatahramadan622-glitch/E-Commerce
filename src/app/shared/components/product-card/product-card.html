<div class="card h-100 product-shadow border-0 position-relative">
  <span class="badge bg-secondary position-absolute top-0 start-0 m-3 px-2 py-1 fs-7">
    {{ product().category }}
  </span>

  <div class="img-container bg-light d-flex align-items-center justify-content-center">
    <img [src]="product().image" [alt]="product().title" class="card-img-top img-fluid product-img">
  </div>

  <div class="card-body d-flex flex-column text-start">
    <h5 class="card-title text-dark text-truncate fs-6 mb-2" [title]="product().title">
      {{ product().title }}
    </h5>

    <div class="d-flex align-items-center gap-1 mb-2 text-warning fs-7">
      <i class="bi bi-star-fill"></i>
      <span class="text-muted fw-bold">{{ product().rating.rate }}</span>
      <span class="text-muted fs-8">({{ product().rating.count }})</span>
    </div>

    <p class="card-text text-muted text-clamp-2 small mb-3">
      {{ product().description }}
    </p>

    <div class="mt-auto d-flex align-items-center justify-content-between">
      <span class="fw-bold text-success fs-5">{{ product().price }} ج.م</span>
      <div class="btn-group gap-1">
        <a [routerLink]="['/product', product().id]" class="btn btn-outline-dark btn-sm rounded" title="عرض التفاصيل">
          <i class="bi bi-eye"></i>
        </a>
        <button class="btn btn-warning btn-sm rounded fw-bold" title="إضافة إلى السلة" (click)="addToCart()">
          <i class="bi bi-cart-plus"></i>
        </button>
      </div>
    </div>
  </div>
</div>
